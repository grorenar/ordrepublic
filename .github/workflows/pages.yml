# Publie l'application COMPILÉE (dist/) sur GitHub Pages.
# Prérequis (une seule fois, dans Settings → Pages) : « Build and deployment → Source » = « GitHub Actions ».
# Avec la source « Deploy from a branch », Pages publierait le code source brut (index.html pointant vers src/main.tsx) → page blanche.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main, claude/cahier-des-charges-phase1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Contrôle de santé : le build doit utiliser des chemins relatifs (sinon page blanche dans le sous-répertoire du dépôt)
      - name: Vérifier les chemins des ressources
        run: |
          if grep -Eq '(src|href)="/(assets|src)/' dist/index.html; then echo "Chemins absolus dans dist/index.html"; exit 1; fi
          grep -Eq 'src="\./assets/' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
