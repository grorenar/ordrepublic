<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Ordre Public — simulation fictive de commandement</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 8 5 13 12 15 7-2 12-7 12-15V7z' fill='%231d4ed8'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <p id="boot-status" style="font:16px system-ui,sans-serif;color:#cbd5e1;padding:24px">Chargement d’Ordre Public…</p>
    </div>
    <noscript><p style="font:16px system-ui,sans-serif;padding:24px">Cette application nécessite JavaScript.</p></noscript>
    <script>
      // Filet de sécurité : si le script principal ne s'exécute pas (fichier introuvable, mauvais chemin de publication,
      // navigateur trop ancien), on l'affiche au lieu de laisser une page blanche.
      window.__bootFail = function (msg) {
        var el = document.getElementById('boot-status') || document.getElementById('app');
        if (!el) return;
        el.id = 'boot-status';
        el.setAttribute('role', 'alert');
        el.style.cssText = 'font:15px system-ui,sans-serif;color:#fecaca;background:#450a0a;padding:20px;margin:24px;border-radius:8px;max-width:760px;white-space:pre-wrap';
        el.textContent = 'Ordre Public n’a pas pu démarrer.\n\n' + msg + '\n\nOuvrez la console du navigateur (F12) pour le détail et signalez cette erreur.';
      };
      window.addEventListener('error', function (e) {
        if (e.target && e.target !== window && (e.target.src || e.target.href)) window.__bootFail('Ressource introuvable : ' + (e.target.src || e.target.href));
      }, true);
      setTimeout(function () {
        if (!window.__booted) window.__bootFail('L’application ne s’est pas initialisée après 10 s (script bloqué ou non chargé).');
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
